services:
  - type: web
    name: syncstage
    runtime: docker
    dockerfilePath: ./Dockerfile.allinone
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health

    envVars:
      - key: DATA_PATH
        value: /app/data/state.json

      - key: CYCLE_SECONDS
        value: "18000"

      - key: ALLOWED_ORIGINS
        value: "*"

    disk:
      name: syncstage-data
      mountPath: /app/data
      sizeGB: 1