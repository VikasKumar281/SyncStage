services:
  - type: web
    name: media-sequencer-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATA_PATH
        value: /app/data/state.json
      - key: CYCLE_SECONDS
        value: "18000"
      - key: ALLOWED_ORIGINS
        value: "*"
    disk:
      name: sequencer-data
      mountPath: /app/data
      sizeGB: 1

  - type: web
    name: media-sequencer-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
