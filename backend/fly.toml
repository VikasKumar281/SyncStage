# Fly.io deployment for the API.
#
#   fly launch --no-deploy --copy-config
#   fly volumes create sequencer_data --size 1
#   fly deploy

app = "media-sequencer-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_PATH = "/app/data/state.json"
  CYCLE_SECONDS = "18000"
  ALLOWED_ORIGINS = "*"

[[mounts]]
  source = "sequencer_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Server-Sent Events are long-lived responses; stopping the machine when it
  # looks idle would sever every connected display.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"
